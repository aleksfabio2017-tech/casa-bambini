<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Bambini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFEC; --surface:#FFFFFF; --surface2:#F3F7F5; --ink:#1E2A30; --muted:#5B6A6F;
  --line:#D2DCD8; --pine:#24513F; --gold:#B7801A; --warn:#A4471F; --ok:#2F7A4F;
  --acc:#4F86A8; --acc-soft:#DCE8F0;
  --head:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-child="Sibilla"]{ --bg:#DCD2EE; --surface2:#F5F1FB; --line:#CFC3E4; --acc:#6E4FA3; --acc-soft:#ECE4F7; }
:root[data-child="Edoardo"]{ --bg:#A9D3C9; --surface2:#EFF7F5; --line:#B9D9D1; --acc:#17695F; --acc-soft:#D6EEEA; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11191B; --surface:#1A2427; --surface2:#202C30; --ink:#E5EDEB; --muted:#9AABAE;
    --line:#2C3A3E; --pine:#86BFA4; --gold:#E2B458; --warn:#F0916A; --ok:#7CCB98;
    --acc:#8DB8D3; --acc-soft:#22343F; color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-child="Sibilla"]{ --bg:#1A1626; --surface:#231E32; --surface2:#2A243B; --line:#3A3250; --acc:#BBA4E6; --acc-soft:#2F2745; }
  :root:not([data-theme="light"])[data-child="Edoardo"]{ --bg:#0D2622; --surface:#15312C; --surface2:#1B3A34; --line:#28493F; --acc:#5CC2B6; --acc-soft:#1C3F3A; }
}
:root[data-theme="dark"]{
  --bg:#11191B; --surface:#1A2427; --surface2:#202C30; --ink:#E5EDEB; --muted:#9AABAE;
  --line:#2C3A3E; --pine:#86BFA4; --gold:#E2B458; --warn:#F0916A; --ok:#7CCB98;
  --acc:#8DB8D3; --acc-soft:#22343F; color-scheme:dark;
}
:root[data-theme="dark"][data-child="Sibilla"]{ --bg:#1A1626; --surface:#231E32; --surface2:#2A243B; --line:#3A3250; --acc:#BBA4E6; --acc-soft:#2F2745; }
:root[data-theme="dark"][data-child="Edoardo"]{ --bg:#0D2622; --surface:#15312C; --surface2:#1B3A34; --line:#28493F; --acc:#5CC2B6; --acc-soft:#1C3F3A; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 156px}

/* intestazione */
header.top{position:relative;padding:22px 0 54px;overflow:hidden}
.ridge{position:absolute;left:-16px;right:-16px;bottom:0;height:70px;pointer-events:none}
.ridge path.far{fill:var(--acc);opacity:.18}
.ridge path.near{fill:var(--acc);opacity:.32}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.today{color:var(--muted);font-size:15px}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.dot i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok i{background:var(--ok)} .dot.wait i{background:var(--gold)} .dot.err i{background:var(--warn)}
h1.name{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.02em;margin:18px 0 4px}
.age{font-size:18px;color:var(--ink)}
.age.missing{color:var(--muted);font-size:16px}
.switch{display:inline-flex;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;position:relative;z-index:1}
.switch button{border:0;background:transparent;padding:8px 18px;border-radius:10px;font-weight:700;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--acc);color:var(--surface)}

/* contenuti */
h2{font-family:var(--head);font-weight:700;font-size:24px;margin:28px 0 12px;letter-spacing:-.01em}
h3{font-family:var(--head);font-weight:500;font-size:19px;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel + .panel{margin-top:12px}
.lead{margin:0;color:var(--muted)}
.big{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.1}
.big small{font-size:17px;font-weight:500;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--acc);color:var(--surface);min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%}
.soon{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.soon:first-of-type{border-top:0}
.soon span{color:var(--muted);font-size:15px;white-space:nowrap}

/* modulo */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.field .hint{font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:11px 12px;min-height:48px}
.field textarea{min-height:72px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.unit{position:relative}
.unit input{padding-right:44px}
.unit b{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:400;color:var(--muted);font-size:15px;pointer-events:none}
.formerr{color:var(--warn);font-weight:700;margin:0 0 12px}

/* grafico */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .series{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart circle{fill:var(--surface);stroke:var(--acc);stroke-width:2.5}
.chart circle.pend{stroke:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:28px 8px}

/* elenco */
.list{margin:0;padding:0;list-style:none}
.list li{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.list li:first-child{border-top:0}
.list .when{font-weight:700}
.list .meta{font-size:14px;color:var(--muted)}
.list .vals{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:13px;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--gold);border:1px solid var(--line);margin-left:6px}

/* impostazioni */
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.notice{border-left:4px solid var(--warn);padding:10px 14px;background:var(--surface2);border-radius:0 12px 12px 0;margin:12px 0}
.notice p{margin:0 0 8px} .notice p:last-child{margin:0}
a{color:var(--acc)}

/* barra in basso */
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bar button{border:0;background:transparent;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted)}
nav.bar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bar button[aria-current="page"]{color:var(--acc);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(142px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* dashboard Edoardo */
.period{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 0}
.period button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px}
.period button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--surface);font-weight:700}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.kpi .big{font-size:30px}
.kpi .lead{font-size:14.5px}
.bar-row{display:grid;grid-template-columns:minmax(96px,38%) 1fr auto;align-items:center;gap:10px;padding:7px 0}
.bar-row .lab{font-size:15px;line-height:1.25}
.bar-row .lab small{display:block;color:var(--muted);font-size:13px}
.bar-track{height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--acc)}
.bar-fill.low{background:var(--warn)} .bar-fill.mid{background:var(--gold)}
.bar-row .pct{font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.chart .limit{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 4}
.chart rect.b{fill:var(--acc)} .chart rect.b.over{fill:var(--warn)}
.chart .area-fill{fill:var(--acc);opacity:.12}
.err{padding:14px 0;border-top:1px solid var(--line)}
.err:first-of-type{border-top:0;padding-top:4px}
.err .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.err .n{font-weight:700;color:var(--warn);white-space:nowrap}
.err .ex{font-size:14.5px;color:var(--muted);margin-top:2px}
.err .tip{font-size:15px;margin-top:8px;background:var(--acc-soft);border-radius:10px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:1px 8px;background:var(--surface2);font-variant-numeric:tabular-nums}
.today-bar{height:14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:6px 0 4px}
.today-bar div{height:100%;background:var(--acc);border-radius:999px}
.today-bar div.over{background:var(--warn)}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.tl li:first-child{border-top:0}
.tl .h{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.tl .k{font-size:13px;color:var(--muted)}
.tl .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th{font-size:13px;color:var(--muted);font-weight:400;text-align:right;padding:0 0 6px 6px}
.cmp th:first-child{text-align:left;padding-left:0}
.cmp td{padding:9px 0 9px 6px;border-top:1px solid var(--line);text-align:right;font-size:15.5px}
.cmp td:first-child{text-align:left;padding-left:0}
.cmp td.t{font-size:13.5px;color:var(--muted);white-space:nowrap}
.cmp td b{font-size:16.5px}
.refresh{float:right;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--acc)}
.testnote{font-size:14px;color:var(--gold);margin:6px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;background:var(--acc)}
.legend i.l{background:none;border-top:2px dashed var(--gold);height:0}
.legend i.o{background:var(--warn);height:10px;width:10px;border-radius:2px}

/* nanna e diario (fase 4a) */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 16px;font-size:15.5px;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--surface);font-weight:700}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 16px}
.stepper button{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:30px;line-height:1;font-weight:700;color:var(--acc)}
.stepper button[disabled]{opacity:.4;cursor:default}
.stepper output{font-family:var(--head);font-weight:700;font-size:48px;min-width:150px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.stepper output small{font-size:20px;font-weight:500;color:var(--muted)}
.already{background:var(--acc-soft);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15.5px}
.already b{font-variant-numeric:tabular-nums}
.chart rect.nb{fill:var(--acc)} .chart rect.nb.pend{fill:var(--gold)}
.chart .avg{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.55}
.chart .miss{fill:var(--line)}
/* percentili OMS */
.chart .pb{stroke:none} .chart .pb.out{fill:var(--acc);opacity:.10} .chart .pb.mid{fill:var(--acc);opacity:.20}
.chart .pc{fill:none;stroke:var(--acc);stroke-width:1;opacity:.55} .chart .pc.p50{stroke-width:1.6;opacity:.9}
.chart .pl{font-size:10px}
.chart .cut{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.chart .mseries{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart circle.m{fill:var(--surface);stroke:var(--ink);stroke-width:2.5} .chart circle.m.pend{stroke:var(--gold)}
.pnote{margin:10px 0 0;font-size:15px}
.pwarn{margin:8px 0 0;font-size:15px;padding:10px 12px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--gold)}
.pdlink{margin-top:20px}
.pdopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;min-height:48px}
.pdopts .pdopt:first-child{border-top:0;padding-top:0}
.pdopt .bx{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;margin-top:1px;background:var(--surface2)}
.pdopt[aria-pressed="true"] .bx{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.pdopt small{display:block;color:var(--muted);font-size:14px}
.small-note{font-size:14px;color:var(--muted);margin:8px 0 0}
.pcv{display:block;font-size:14px;color:var(--muted)}
.legend i.a{background:none;border-top:2px dashed var(--ink);height:0;opacity:.55}
.note-txt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.ctag{display:inline-block;font-size:13px;border-radius:6px;padding:1px 8px;background:var(--acc-soft);color:var(--ink);margin-right:6px;font-weight:700}
.month{font-family:var(--head);font-weight:500;font-size:16px;color:var(--muted);margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.month:first-child{margin-top:0;padding-top:0;border-top:0}
.dlist{list-style:none;margin:0;padding:0}
.dlist li{padding:12px 0;border-top:1px solid var(--line)}
.dlist li:first-child{border-top:0}
.dlist .when{font-size:14px;color:var(--muted)}
.fresh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:12px 0 0}

/* attività del giorno (blocco 4b) */
.att .atitle{font-family:var(--head);font-weight:700;font-size:23px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.atags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.atags .ctag{margin-right:0}
.asub{font-weight:700;font-size:15px;margin:16px 0 4px;color:var(--muted)}
.seg + .asub{margin-top:4px}
.amat{margin:0;padding-left:20px}
.amat li{margin:2px 0}
.asteps{margin:0;padding-left:22px}
.asteps li{margin:6px 0;padding-left:2px}
.asteps li::marker{font-weight:700;color:var(--acc)}
.princ{background:var(--acc-soft);border-radius:12px;padding:10px 14px;margin:14px 0 0;font-size:15.5px}
.asafe{font-size:14.5px;color:var(--warn);margin:10px 0 0}
.arow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.arow .btn{flex:1 1 130px}
.afatta{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.faces button{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;min-height:76px}
.faces button span{font-size:30px;line-height:1.1}
.faces button[aria-pressed="true"]{border:2px solid var(--acc);background:var(--acc-soft);font-weight:700}
.arch details{border-top:1px solid var(--line)}
.arch details:first-child{border-top:0}
.arch summary{list-style:none;cursor:pointer;padding:12px 28px 12px 0;position:relative;display:flex;flex-direction:column;gap:2px}
.arch summary::-webkit-details-marker{display:none}
.arch summary::after{content:"";position:absolute;right:6px;top:20px;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg)}
.arch details[open] summary::after{transform:rotate(-135deg);top:24px}
.arch .stit{font-weight:700}
.arch .done{color:var(--ok)}
.arch .smeta{font-size:14px;color:var(--muted)}
.arch details .att{padding:0 0 14px}
/* sviluppo e ambiente (blocco 4c) */
.segn{font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums}
.svp{margin-top:12px}
.svh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.svn{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.tlist{list-style:none;margin:4px 0 0;padding:0}
.tlist li{padding:10px 0;border-top:1px solid var(--line)}
.tlist li:first-child{border-top:0}
.trow{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.tchk{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);font-size:20px;font-weight:700;line-height:1;color:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.tchk[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);cursor:default}
.ttx{padding-top:6px;line-height:1.35}
.tmeta{font-size:14px;color:var(--muted);margin-top:3px}
.linkbtn{border:0;background:none;padding:0;color:var(--acc);text-decoration:underline;font-size:14px}
.tform{margin:10px 0 2px 52px;padding:12px;background:var(--surface2);border-radius:12px}
.tform .field input{background:var(--surface)}
/* salute (blocco 5d) */
.tright{display:inline-flex;align-items:center;gap:8px}

const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
function longDate(d){ return GIORNI[d.getDay()]+" "+d.getDate()+" "+MESI[d.getMonth()]; }
function shortDate(d){ return d.getDate()+" "+MESI[d.getMonth()].slice(0,3)+" "+String(d.getFullYear()).slice(2); }
function timeOf(ts){ const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmt(n,dec){ return n==null?"":n.toLocaleString("it-IT",{minimumFractionDigits:0,maximumFractionDigits:dec}); }

function ageParts(b,d){
  let y=d.getFullYear()-b.getFullYear(), m=d.getMonth()-b.getMonth(), dd=d.getDate()-b.getDate();
  if(dd<0){ m--; dd += new Date(d.getFullYear(), d.getMonth(), 0).getDate(); }
  if(m<0){ y--; m+=12; }
  return {months:Math.max(0,y*12+m), days:Math.max(0,dd)};
}
function plural(n,one,many){ return n+" "+(n===1?one:many); }
function ageLabel(b,d){
  if(!b||!d||d<b) return "";
  const a = ageParts(b,d);
  if(a.months<24){
    if(a.months===0) return plural(a.days,"giorno","giorni");
    return plural(a.months,"mese","mesi") + (a.days? " e "+plural(a.days,"giorno","giorni"):"");
  }
  const y=Math.floor(a.months/12), r=a.months%12;
  return plural(y,"anno","anni") + (r? " e "+plural(r,"mese","mesi"):"");
}
function shortAge(b,d){
  if(!b||!d||d<b) return "";
  const a=ageParts(b,d);
  if(a.months<24) return a.months+" m";
  return Math.floor(a.months/12)+" a "+(a.months%12)+" m";
}
function birthOf(c){ return parseDate(S.births[c]); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2400); }

/* righe: {id,data,bambino,peso,altezza,cc,dove,note,origine} */
function fromSheet(r){
  return {id:r[0]||"", data:r[1]||"", bambino:r[2]||"", peso:num(r[3]), altezza:num(r[4]), cc:num(r[5]), dove:r[6]||"", note:r[7]||"", origine:r[8]||""};
}
function toSheet(o){
  const sd = toSerial(o.data);
  return [o.id, sd==null ? o.data : sd, o.bambino, o.peso==null?"":o.peso, o.altezza==null?"":o.altezza, o.cc==null?"":o.cc, o.dove||"", o.note||"", "app-genitori"];
}
function measuresFor(c){
  const sheetIds = new Set(S.rows.map(r=>r.id));
  const all = S.rows.filter(r=>r.bambino===c && r.origine!=="prova").map(r=>Object.assign({pending:false},r))
    .concat(S.queue.filter(q=>q.bambino===c && !sheetIds.has(q.id)).map(q=>Object.assign({pending:true},q)));
  all.forEach(r=>{ r._d = parseDate(r.data); });
  return all.filter(r=>r._d).sort((a,b)=>a._d-b._d);
}

/* ---------- collegamento al foglio ---------- */
function errInfo(e){
  const code = (e && e.code) || "upstream_error";
  const map = {
    server_not_connected:"Il connettore Google Sheets non è collegato a questo account. Aggiungilo da claude.ai, Impostazioni → Connettori.",
    needs_reauth:"Il collegamento a Google Sheets è scaduto. Ricollegalo da claude.ai, Impostazioni → Connettori.",
    selection_required:"Ci sono più connettori Google Sheets: scegli quale usare quando claude.ai te lo chiede, poi sincronizza.",
    not_in_manifest:"L'accesso al foglio è stato negato per questa pagina. Riattivalo dai permessi della pagina.",
    approval_required:"Serve il tuo consenso per leggere e scrivere il foglio.",
    blocked_by_policy:"L'organizzazione blocca l'uso di Google Sheets da questa pagina.",
    server_unavailable:"Google Sheets non risponde in questo momento. I dati restano sul telefono e partono alla prossima sincronizzazione.",
    tool_error:"Google Sheets ha rifiutato la richiesta: " + (e && e.message ? e.message : "errore sconosciuto") + ".",
    not_granted:"Questa vista non può usare i connettori: apri la pagina dall'app Claude o da claude.ai con l'account di famiglia.",
    capability_disabled:"Questa vista non può usare i connettori: apri la pagina dall'app Claude o da claude.ai con l'account di famiglia."
  };
  return {code, msg: map[code] || "Collegamento al foglio non riuscito. I dati restano sul telefono e partono alla prossima sincronizzazione."};
}
async function call(tool, input){
  const r = await mcp.callTool(SERVER, tool, input, {cache:false});
  let p = r && r.payload !== undefined ? r.payload : r;
  if(typeof p === "string"){ try{ p = JSON.parse(p); }catch(e){} }
  return p;
}
async function read(range){
  const go = async ()=>{ const p = await call("get_values", {spreadsheetId:SHEET_ID, range}); return (p && Array.isArray(p.values)) ? p.values : []; };
  try{ return await go(); }
  catch(e){
    if(e && e.retryable){ await new Promise(r=>setTimeout(r, (e.retryAfterMs||800) + Math.random()*700)); return await go(); }
    throw e;
  }
}
/* Scrive righe nuove: su scheda vuota la prima va in riga 2 (già formattata), le altre in coda */
async function pushRows(sheet, lastCol, hasData, vals){
  if(!vals.length) return;
  if(!hasData){
    await call("update_values", {spreadsheetId:SHEET_ID, range:sheet+"!A2:"+lastCol+"2", values:[vals[0]]});
    if(vals.length>1) await call("append_values", {spreadsheetId:SHEET_ID, range:sheet+"!A1:"+lastCol+"1", values:vals.slice(1)});
  }else{
    await call("append_values", {spreadsheetId:SHEET_ID, range:sheet+"!A1:"+lastCol+"1", values:vals});
  }
}
async function sync(manual){
  if(syncing) return;
  if(!mcp){ net={state:"offline",code:"not_granted",msg:errInfo({code:"not_granted"}).msg}; render(); if(manual) toast("Foglio non raggiungibile da qui"); return; }
  syncing = true; net = Object.assign({}, net, {state:"syncing"}); render();
  let sent = 0;
  try{
    const bam = await read("Bambini!A2:E");
    /* allergie e note (blocco 5d): colonna E, una cella per bambino; vale l'ultima scritta */
    for(const c of Object.keys(S.qs.allerg)){
      const i = bam.findIndex(r=>r && r[0]===c);
      if(i<0){ delete S.qs.allerg[c]; continue; }
      await call("update_values", {spreadsheetId:SHEET_ID, range:"Bambini!E"+(i+2), values:[[S.qs.allerg[c].text]]});
      bam[i][4] = S.qs.allerg[c].text; delete S.qs.allerg[c]; sent++; save();
    }
    S.allerg = {}; bam.forEach(r=>{ if(r && CHILDREN.includes(r[0])) S.allerg[r[0]] = String(r[4]||""); });
    bam.forEach(r=>{ if(CHILDREN.includes(r[0]) && r[1]) S.births[r[0]] = String(r[1]); if(CHILDREN.includes(r[0]) && r[2]){ S.sex=S.sex||{}; S.sex[r[0]]=String(r[2]).trim(); } });
    /* Crescita */
    const cre = (await read("Crescita!A2:I")).filter(r=>r && r[0]);
    let rows = cre.map(fromSheet);
    const ids = new Set(rows.map(r=>r.id));
    const pending = S.queue.filter(q=>!ids.has(q.id));
    await pushRows("Crescita", "I", cre.length>0, pending.map(toSheet));
    rows = rows.concat(pending.map(q=>Object.assign({}, q, {origine:"app-genitori"})));
    sent += pending.length;
    S.rows = rows; S.queue = []; save();
    /* Sonno: un valore al giorno, vale la riga più recente */
    const son = (await read("Sonno!A2:F")).filter(r=>r && r[0]);
    const sIds = new Set(son.map(r=>r[0]));
    const sPend = S.qs.sonno.filter(q=>!sIds.has(q.id));
    await pushRows("Sonno", "F", son.length>0, sPend.map(sonnoToSheet));
    sent += sPend.length;
    S.sonno = son.map((r,i)=>{ const d=parseDate(r[1]); return {id:r[0], day:d?dayKey(d):"", bambino:r[2]||"", ore:num(r[3]), note:r[4]||"", origine:r[5]||"", i}; })
      .concat(sPend.map((q,k)=>Object.assign({}, q, {origine:"app-genitori", i:son.length+k})));
    S.qs.sonno = []; save();
    /* Diario */
    const dia = (await read("Diario!A2:G")).filter(r=>r && r[0]);
    const dIds = new Set(dia.map(r=>r[0]));
    const dPend = S.qs.diario.filter(q=>!dIds.has(q.id));
    await pushRows("Diario", "G", dia.length>0, dPend.map(diarioToSheet));
    sent += dPend.length;
    S.diario = dia.map(r=>({id:r[0], data:r[1]||"", bambino:r[2]||"", cat:r[3]||"", testo:r[4]||"", foto:r[5]||"", origine:r[6]||""}))
      .concat(dPend.map(q=>Object.assign({}, q, {origine:"app-genitori"})));
    S.qs.diario = []; save();
    /* Attività */
    const atv = (await read("Attività!A2:I")).filter(r=>r && r[0]);
    const aIds = new Set(atv.map(r=>r[0]));
    const aPend = S.qs.attivita.filter(q=>!aIds.has(q.id));
    await pushRows("Attività", "I", atv.length>0, aPend.map(attToSheet));
    sent += aPend.length;
    S.attiv = atv.map(r=>({id:r[0], data:r[1]||"", bambino:r[2]||"", titolo:r[3]||"", metodo:r[4]||"", durata:num(r[5]), voto:num(r[6]), note:r[7]||"", origine:r[8]||""}))
      .concat(aPend.map(q=>Object.assign({}, q, {origine:"app-genitori"})));
    S.qs.attivita = []; save();
    /* Sviluppo: vale l'ultima riga di ogni tappa ("tolta" in Note = spunta tolta) */
    const sv = (await read("Sviluppo!A2:G")).filter(r=>r && r[0]);
    const svIds = new Set(sv.map(r=>r[0]));
    const svPend = S.qs.sviluppo.filter(q=>!svIds.has(q.id));
    await pushRows("Sviluppo", "G", sv.length>0, svPend.map(svToSheet));
    sent += svPend.length;
    S.svil = sv.map((r,i)=>{ const d=parseDate(r[1]); return {id:r[0], day:d?dayKey(d):"", bambino:r[2]||"", area:r[3]||"", tappa:r[4]||"", note:r[5]||"", origine:r[6]||"", i}; })
      .concat(svPend.map((q,k)=>Object.assign({}, q, {origine:"app-genitori", i:sv.length+k})));
    S.qs.sviluppo = []; save();
    /* Appuntamenti (blocco 5b): li scrive Claude dalla chat insieme agli eventi sul calendario, o l'app */
    const ap = (await read("Appuntamenti!A2:J")).filter(r=>r && r[0]);
    const apIds = new Set(ap.map(r=>r[0]));
    const apPend = S.qs.appunt.filter(q=>!apIds.has(q.id));
    await pushRows("Appuntamenti", "J", ap.length>0, apPend.map(appToSheet));
    sent += apPend.length;
    S.app = ap.map(r=>({id:r[0], data:r[1]||"", bambino:r[2]||"", tipo:r[3]||"", titolo:r[4]||"", entro:r[5]||"", luogo:r[6]||"", note:r[7]||"", stato:r[8]||"", origine:r[9]||""}))
      .concat(apPend.map(q=>Object.assign({}, q, {origine:"app-genitori"})));
    S.qs.appunt = []; save();
    /* Salute (blocco 5d) */
    const sa = (await read("Salute!A2:J")).filter(r=>r && r[0]);
    const saIds = new Set(sa.map(r=>r[0]));
    const saPend = S.qs.salute.filter(q=>!saIds.has(q.id));
    await pushRows("Salute", "J", sa.length>0, saPend.map(saluteToSheet));
    sent += saPend.length;
    S.salute = sa.map((r,i)=>({id:r[0], data:r[1]||"", bambino:r[2]||"", tipo:r[3]||"", cosa:r[4]||"", det:r[5]||"", temp:num(r[6]), ep:r[7]||"", note:r[8]||"", origine:r[9]||"", i}))
      .concat(saPend.map(q=>Object.assign({}, q, {origine:"app-genitori"})));
    S.qs.salute = []; save();
    /* Asilo (28/10/2026): una riga per giornata, vale l'ultima */
    const as = (await read("Asilo!A2:J")).filter(r=>r && r[0]);
    const asIds = new Set(as.map(r=>r[0]));
    const asPend = S.qs.asilo.filter(q=>!asIds.has(q.id));
    await pushRows("Asilo", "J", as.length>0, asPend.map(asiloToSheet));
    sent += asPend.length;
    S.asilo = as.map((r,i)=>{ const d=parseDate(r[1]); return {id:r[0], day:d?dayKey(d):"", bambino:r[2]||"", nanna:num(r[3]), cacca:caccaNorm(r[4]), cibo:r[5]||"", quanto:r[6]||"", umore:r[7]||"", note:r[8]||"", origine:r[9]||"", i}; })
      .concat(asPend.map((q,k)=>Object.assign({}, q, {origine:"app-genitori", i:as.length+k})));
    S.qs.asilo = []; save();
    /* Settimane (blocco 5e): una riga per bambino e settimana, vale l'ultima */
    const se = (await read("Settimane!A2:L")).filter(r=>r && r[0]);
    const seIds = new Set(se.map(r=>r[0]));
    const sePend = S.qs.sett.filter(q=>!seIds.has(q.id));
    await pushRows("Settimane", "L", se.length>0, sePend.map(settToSheet));
    sent += sePend.length;
    S.sett = se.map((r,i)=>{ const d=parseDate(r[1]); return {id:r[0], mon:d?dayKey(d):"", bambino:r[2]||"", ore:num(r[3]), come:r[4]||"", orari:r[5]||"", prima:r[6]||"", cons:r[7]||"", amm:r[8]||"", voto:num(r[9]), nota:r[10]||"", origine:r[11]||"", i}; })
      .concat(sePend.map((q,k)=>Object.assign({}, q, {origine:"app-genitori", i:se.length+k})));
    S.qs.sett = []; S.lastSync = Date.now(); save();
    /* dati dell'app di Edo: solo lettura, mai scrittura */
    try{
      const mis = (await read("'Edo - Missioni'!A2:I")).filter(r=>r && r[0]);
      const err = (await read("'Edo - Errori'!A2:G")).filter(r=>r && r[0]);
      const gio = (await read("'Edo - Giochi'!A2:J")).filter(r=>r && r[0]);
      let uso = []; try{ uso = (await read("'Edo - Uso'!A2:F")).filter(r=>r && r[0]); }catch(e){}
      S.edo = {at:Date.now(),
        mis: mis.map(r=>[r[0], r[1]||"", r[2]||"", r[3]||"", r[4]||"", num(r[5]), num(r[6]), num(r[7]), r[8]||""]),
        err: err.map(r=>[r[0], r[1]||"", r[2]||"", r[3]||"", r[4]||"", r[5]||"", r[6]||""]),
        gio: gio.map(r=>[r[0], r[1]||"", r[2]||"", num(r[3]), num(r[4]), num(r[5]), r[6]||"", r[7]||"", r[8]||"", num(r[9])]),
        uso: uso.map(r=>[r[0], r[1]||"", num(r[2]), num(r[3]), num(r[4]), r[5]||""])};
      save();
    }catch(e){ if(!S.edo) throw e; }
    net = {state:"ok", code:null, msg:""};
    if(manual || sent) toast(sent ? plural(sent,"dato inviato","dati inviati")+" al foglio" : "Foglio sincronizzato");
  }catch(e){
    const info = errInfo(e);
    net = {state:"error", code:info.code, msg:info.msg};
    save();
  }finally{
    syncing = false; render();
  }
}

function addMeasure(){
  const v = id=>$(id) ? $(id).value : "";
  const when = v("f-data");
  const d = when ? new Date(when) : null;
  const peso = num(v("f-peso")), alt = num(v("f-alt")), cc = num(v("f-cc"));
  formError = "";
  if(!d || isNaN(d)) formError = "Indica la data della misura.";
  else if(d.getTime() > Date.now()+60000) formError = "La data è nel futuro: controllala.";
  else if(peso==null && alt==null && cc==null) formError = "Inserisci almeno peso, altezza o circonferenza.";
  else if(peso!=null && (peso<1 || peso>150)) formError = "Il peso va in chilogrammi, tra 1 e 150.";
  else if(alt!=null && (alt<30 || alt>220)) formError = "L'altezza va in centimetri, tra 30 e 220.";
  else if(cc!=null && (cc<25 || cc>65)) formError = "La circonferenza cranica va in centimetri, tra 25 e 65.";
  if(formError){ render(); const el=$("formerr"); if(el) el.scrollIntoView({block:"center"}); return; }
  const row = {id:"genitori-crescita-"+Date.now(), data:stamp(d), bambino:S.child, peso, altezza:alt, cc,
               dove:v("f-dove"), note:v("f-note").trim(), origine:"app-genitori"};
  S.queue.push(row); save();
  toast("Misura salvata");
  render();
  sync(false);
}
function removePending(id){
  S.queue = S.queue.filter(q=>q.id!==id); save(); toast("Misura eliminata"); render();
}

/* ---------- nanna e diario (fase 4a) ---------- */
function dayFromKey(k){ const m=String(k).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function daySerial(k){ const d=dayFromKey(k); return d? Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/864e5 + 25569 : k; }
function sonnoToSheet(o){ return [o.id, daySerial(o.day), o.bambino, o.ore, o.note||"", "app-genitori"]; }
function diarioToSheet(o){ const sd=toSerial(o.data); return [o.id, sd==null?o.data:sd, o.bambino, o.cat, o.testo, o.foto||"", "app-genitori"]; }
function pendingCount(){ return S.queue.length + S.qs.sonno.length + S.qs.diario.length + S.qs.attivita.length + S.qs.sviluppo.length + S.qs.appunt.length + S.qs.salute.length + Object.keys(S.qs.allerg).length + S.qs.sett.length + S.qs.asilo.length; }
function ordOf(id){ const m=String(id||"").match(/(\d{12,})/); return m? Number(m[1]) : 0; }
function newer(a,b){ if(a.ord && b.ord && a.ord!==b.ord) return a.ord>b.ord; return a.idx>b.idx; }
/* per ogni giorno la riga più recente (ordine per ID con timestamp, poi ordine delle righe) */
function sonnoDays(c){
  const sheetIds = new Set(S.sonno.map(r=>r.id));
  const all = S.sonno.filter(r=>r.bambino===c && r.day && r.ore!=null && r.origine!=="test" && r.origine!=="prova")
      .map(r=>Object.assign({}, r, {pending:false, ord:ordOf(r.id), idx:r.i||0}))
    .concat(S.qs.sonno.filter(q=>q.bambino===c && !sheetIds.has(q.id))
      .map(q=>Object.assign({}, q, {pending:true, ord:ordOf(q.id), idx:1e12+ordOf(q.id)})));
  const map = {};
  all.forEach(r=>{ if(!map[r.day] || newer(r, map[r.day])) map[r.day]=r; });
  return map;
}
function defaultOre(c){ const b=birthOf(c); const m = b? ageParts(b,new Date()).months : 12; return m<24 ? 13 : m<36 ? 12 : 10.5; }
function nKey(){ return nDay==="ieri" ? dayKey(dayStart(1)) : nDay==="oggi" ? dayKey(dayStart(0)) : nDay; }
function dayWord(k){
  if(k===dayKey(dayStart(0))) return "oggi";
  if(k===dayKey(dayStart(1))) return "ieri";
  const d=dayFromKey(k); return d? GIORNI[d.getDay()]+" "+d.getDate()+" "+MESI[d.getMonth()] : k;
}
function oreTxt(v){ return fmt(v,1)+" h"; }
function lastOre(map){ const ks=Object.keys(map).sort(); return ks.length? map[ks[ks.length-1]].ore : null; }
function nShown(map){ const k=nKey(); return nVal!=null ? nVal : map[k] ? map[k].ore : (lastOre(map) ?? defaultOre(S.child)); }
function avgDays(map, from, to){
  let sum=0, n=0;
  for(let o=from;o<=to;o++){ const r=map[dayKey(dayStart(o))]; if(r && !/solo pisolino/i.test(String(r.note||""))){ sum+=r.ore; n++; } }
  return n? {avg:sum/n, n} : null;
}
function addSonno(){
  const map=sonnoDays(S.child), k=nKey(), d=dayFromKey(k), v=nShown(map);
  nErr = "";
  if(!d) nErr = "Scegli il giorno.";
  else if(d > dayStart(0)) nErr = "Il giorno è nel futuro: controllalo.";
  else if(!(v>=0 && v<=24)) nErr = "Le ore vanno tra 0 e 24.";
  if(nErr){ render(); return; }
  const had = map[k];
  const note = $("n-note") ? $("n-note").value.trim().slice(0,300) : "";
  S.qs.sonno.push({id:"genitori-sonno-"+Date.now(), day:k, bambino:S.child, ore:Math.round(v*2)/2, note});
  save(); nVal = null;
  toast(had ? "Nanna corretta" : "Nanna salvata");
  render(); sync(false);
}
const CATS = [["prima volta","Prima volta"],["parola","Parola nuova"],["ricordo","Ricordo"],["salute","Salute"]];
function catLabel(c){ const f=CATS.concat([["asilo","Asilo"],["scuola","Scuola"],["umore","Umore"]]).find(x=>x[0]===String(c).toLowerCase()); return f? f[1] : (c||"Nota"); }
function diarioFor(c){
  const sheetIds = new Set(S.diario.map(r=>r.id));
  const all = S.diario.filter(r=>r.bambino===c && r.origine!=="test" && r.origine!=="prova").map(r=>Object.assign({pending:false}, r))
    .concat(S.qs.diario.filter(q=>q.bambino===c && !sheetIds.has(q.id)).map(q=>Object.assign({pending:true}, q)));
  all.forEach(r=>{ r._d=parseDate(r.data); });
  return all.filter(r=>r._d && String(r.cat).toLowerCase()!=="umore").sort((a,b)=>(b._d-a._d) || (ordOf(b.id)-ordOf(a.id)));
}
function safeUrl(u){ u=String(u||"").trim(); return /^https?:\/\/\S+$/i.test(u) ? u : ""; }
function addDiario(){
  const v = id=>$(id) ? $(id).value : "";
  const testo = v("d-testo").trim(), when = v("d-data"), foto = v("d-foto").trim();
  const d = when ? new Date(when) : null;
  dErr = "";
  if(!testo) dErr = "Scrivi qualcosa nella nota.";
  else if(testo.length>1000) dErr = "La nota è troppo lunga (massimo 1000 caratteri).";
  else if(!d || isNaN(d)) dErr = "Indica la data.";
  else if(d.getTime() > Date.now()+60000) dErr = "La data è nel futuro: controllala.";
  else if(foto && !safeUrl(foto)) dErr = "Il link della foto deve iniziare con https://";
  if(dErr){ render(); return false; }
  S.qs.diario.push({id:"genitori-diario-"+Date.now(), data:stamp(d), bambino:S.child, cat:dCat, testo, foto:safeUrl(foto)});
  save(); toast("Nota salvata"); render(); sync(false);
  return true;
}
function removeQueued(kind, id){
  S.qs[kind] = S.qs[kind].filter(q=>q.id!==id); save();
  toast(kind==="sonno" ? "Nanna eliminata" : "Nota eliminata"); render();
}

function fasciaOf(c){ const b=birthOf(c); const m = b? ageParts(b,new Date()).months : 12; return m<12 ? 1 : m<18 ? 2 : 3; }
function fasciaLabel(f){ const x=FASCE.find(y=>y[0]===f); return x? x[1] : ""; }

function attToSheet(o){ const sd=toSerial(o.data); return [o.id, sd==null?o.data:sd, o.bambino, o.titolo, o.metodo, o.durata, o.voto, o.note||"", "app-genitori"]; }
/* righe fatte: foglio + coda locale, dalla più recente */
function attFatte(c){
  const ids = new Set(S.attiv.map(r=>r.id));
  const all = S.attiv.filter(r=>r.bambino===c && r.origine!=="test" && r.origine!=="prova").map(r=>Object.assign({pending:false}, r))
    .concat(S.qs.attivita.filter(q=>q.bambino===c && !ids.has(q.id)).map(q=>Object.assign({pending:true}, q)));
  all.forEach(r=>{ r._d=parseDate(r.data); });
  return all.filter(r=>r._d).sort((a,b)=>(b._d-a._d) || (ordOf(b.id)-ordOf(a.id)));
}
function attStats(c){
  const m = {};
  attFatte(c).forEach(r=>{ const a=attByTitle(r.titolo); if(!a) return;
    const s = m[a.id] || (m[a.id]={n:0, last:null, voto:null}); s.n++;
    if(!s.last || r._d>s.last){ s.last=r._d; s.voto=r.voto; } });
  return m;
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
/* ordine del giorno, uguale su tutti i telefoni: mescolato con la data, in fondo quelle fatte negli ultimi 14 giorni (oggi escluso) */
function attOrder(c, day){
  const f=fasciaOf(c), t0=dayStart(0), lim=dayStart(14);
  const recent = new Set(attFatte(c).filter(r=>r._d>=lim && r._d<t0).map(r=>{ const a=attByTitle(r.titolo); return a? a.id : ""; }));
  const list = ATT.filter(a=>a.f===f).map(a=>({a, k:hashStr(day+"|"+c+"|"+a.id)})).sort((x,y)=>x.k-y.k).map(x=>x.a);
  return list.filter(a=>!recent.has(a.id)).concat(list.filter(a=>recent.has(a.id)));
}
function attState(){ const day=dayKey(dayStart(0)); if(!S.att || S.att.day!==day) S.att={day, n:0, pick:null}; return S.att; }
function attToday(c){
  const st=attState(), ord=attOrder(c, st.day);
  if(st.pick){ const p=ATT.find(a=>a.id===st.pick); if(p) return p; }
  return ord.length ? ord[st.n % ord.length] : null;
}
function attAltra(){ const st=attState(); st.n++; st.pick=null; aOpen=false; aVoto=0; aErr=""; save(); render(); }

  const note = $("a-note") ? $("a-note").value.trim().slice(0,300) : "";
  S.qs.attivita.push({id:"genitori-attivita-"+Date.now(), data:stamp(new Date()), bambino:S.child, titolo:a.t, metodo:a.m, durata:Math.round(dur), voto:aVoto, note});

function svilMap(c){
  const ids = new Set(S.svil.map(r=>r.id));
  const all = S.svil.filter(r=>r.bambino===c && r.tappa && r.origine!=="test" && r.origine!=="prova")

      .map(q=>Object.assign({}, q, {pending:true, ord:ordOf(q.id), idx:1e12+ordOf(q.id)})));
  const map = {};
  all.forEach(r=>{ if(!map[r.tappa] || newer(r, map[r.tappa])) map[r.tappa]=r; });

    '<div class="panel"><p class="lead">Questa sezione è pensata per Sibilla.</p><p style="margin:12px 0 0"><button class="btn" data-child="Sibilla">Passa a Sibilla</button></p></div>';
}
function viewSviluppo(){
  const c = S.child; if(c!=="Sibilla") return onlySibilla("Tappe di sviluppo");
  const map = svilMap(c), cur = tappeAge(c), age = sAge || cur, all = svCount(map, null);
  let h = '<p style="margin:20px 0 0"><button class="btn ghost small" data-go="oggi">Torna a Oggi</button></p>'+
    '<h2>Tappe di sviluppo</h2><div class="panel">'+
    '<p class="lead">Cose che fa la maggior parte dei bambini (almeno 3 su 4) entro una certa età. Ognuno ha i suoi tempi: segnatele quando le vedete, come in un diario.</p>'+
    '<div class="asub">Età</div><div class="seg" style="margin:0">'+ETA_SV.map(a=>{ const n=svCount(map,a);
      return '<button data-sage="'+a+'" aria-pressed="'+(a===age)+'">'+a+' mesi <small class="segn">'+n.done+'/'+n.tot+'</small>'+(a===cur?' ●':'')+'</button>'; }).join("")+'</div>'+
    '<p class="lead" style="font-size:14.5px;margin:12px 0 0">In tutto '+plural(all.done,"tappa raggiunta","tappe raggiunte")+' su '+all.tot+'. ● = l\u2019età da osservare adesso.</p></div>';
  AREE_SV.forEach(([ak,al])=>{
    const list = TAPPE.filter(t=>t.m===age && t.ar===ak); if(!list.length) return;
    const done = list.filter(t=>map[t.t]).length;
    h += '<div class="panel svp"><div class="svh"><h3>'+al+'</h3><span class="svn">'+done+'/'+list.length+'</span></div><ul class="tlist">';
    list.forEach(t=>{
      const r = map[t.t], open = tOpen===t.id;
      h += '<li><div class="trow"><button class="tchk" data-topen="'+t.id+'" aria-pressed="'+(!!r)+'" aria-label="'+(r?"Raggiunta: ":"Segna: ")+esc(t.t)+'">'+(r?'✓':'')+'</button>'+
        '<div class="ttx"><div>'+esc(t.t)+'</div>'+
        (r ? '<div class="tmeta">dal '+esc(shortDate(dayFromKey(r.day)||new Date()))+(r.pending?' <span class="tag">in attesa</span>':'')+(r.note?' · '+esc(r.note):'')+
             ' · <button class="linkbtn" data-toff="'+t.id+'">togli</button></div>' : '')+'</div></div>';
      if(open && !r){
        h += '<div class="tform"><div class="grid3"><div class="field"><label for="t-data">Da quando</label><input type="date" id="t-data" max="'+dayKey(dayStart(0))+'" value="'+dayKey(dayStart(0))+'"></div></div>'+
          '<div class="field"><label for="t-note">Nota <span class="hint">(facoltativa)</span></label><input id="t-note" maxlength="200" placeholder="Dove, con chi, com\u2019è andata"></div>'+
          (tErr?'<p class="formerr">'+esc(tErr)+'</p>':'')+
          '<div class="arow" style="margin-top:4px"><button class="btn" id="t-save" data-tid="'+t.id+'">Salva</button><button class="btn ghost" id="t-cancel">Annulla</button></div></div>';
      }
      h += '</li>';
    });
    h += '</ul>';
    if(SV_ATT[ak]) h += '<p style="margin:10px 0 0"><button class="btn ghost small" data-sact="'+SV_ATT[ak]+'">Attività per '+esc(SV_ATT[ak].toLowerCase())+'</button></p>';
    h += '</div>';
  });
  h += '<div class="panel"><p class="lead" style="font-size:14.5px;margin:0">Se qualcosa vi preoccupa, se a un\u2019età mancano più tappe o se perde capacità che aveva, parlatene con il pediatra: non serve aspettare il bilancio di salute.</p>'+
    '<p class="lead" style="font-size:13.5px;margin:10px 0 0">Fonte: tappe CDC «Learn the Signs. Act Early.» (2022), tradotte. In Autonomia sono raccolte le tappe CDC su mangiare, bere, lavarsi e vestirsi. Per togliere una spunta l\u2019app aggiunge una riga «tolta» nel foglio.</p></div>';
  return h;
}

function viewSvOggi(c){
  const map = svilMap(c), age = tappeAge(c), n = svCount(map, age), all = svCount(map, null);

    '<div class="stats"><div><div class="big">'+n.done+' <small>di '+n.tot+'</small></div><div class="lead">tappe dei '+age+' mesi</div></div>'+
    '<div><div class="big">'+all.done+'</div><div class="lead">'+(all.done===1?"tappa raggiunta":"tappe raggiunte")+' in tutto</div></div></div>';

function statusChip(){
  const q = pendingCount();
  if(syncing || net.state==="connecting") return '<span class="dot"><i></i>Sincronizzo</span>';
  if(net.state==="error"||net.state==="offline") return '<button class="dot err" data-go="impostazioni" aria-label="Foglio non collegato"><i></i>'+(q?q+" in attesa":"Offline")+'</button>';
  if(q) return '<button class="dot wait" data-go="impostazioni"><i></i>'+q+' in attesa</button>';
  return '<button class="dot ok" data-go="impostazioni" aria-label="Foglio collegato"><i></i>'+(S.lastSync?timeOf(S.lastSync):"Collegato")+'</button>';
}

function lastValues(c){
  const ms = measuresFor(c);
  const pick = k=>{ for(let i=ms.length-1;i>=0;i--) if(ms[i][k]!=null) return ms[i]; return null; };
  return {peso:pick("peso"), altezza:pick("altezza"), cc:pick("cc"), count:ms.length};
}

function since(list, days){ if(!days) return list; const c=dayStart(days-1); return list.filter(x=>x._d>=c); }
function sumGT(list){ return list.reduce((a,m)=>{ a.g+=m.g; a.t+=m.t; return a; }, {g:0,t:0}); }
function perLabel(p){ return p===7?"negli ultimi 7 giorni":p===30?"negli ultimi 30 giorni":"da sempre"; }

function tipFor(ab){
  const m = AB_MAP[ab]; if(!m) return "";
  const [pian, liv, tit, allenabile] = m;
  const mis = /^(Super )?[Ss]fida \d+$/.test(tit) ? "il livello "+liv : "la missione «"+tit+"» (livello "+liv+")";
  if(allenabile) return "Su "+pian+": l’allenamento «"+ab.charAt(0).toLowerCase()+ab.slice(1)+"» da «I miei progressi», oppure "+mis+".";
  if(pian==="Terra") return "Sulla Terra: rileggete insieme le schede di «"+tit+"» e rifate il quiz.";
  return "Riascoltate insieme una storia e rifate le domande finali.";
}

function weeklySVG(mis){
  const n=new Date(); const mon = new Date(n.getFullYear(), n.getMonth(), n.getDate() - ((n.getDay()+6)%7));
  const weeks=[]; for(let i=7;i>=0;i--){ const s=new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()-7*i); weeks.push({s, e:new Date(s.getFullYear(), s.getMonth(), s.getDate()+7), g:0, t:0, n:0}); }
  mis.forEach(m=>{ const w=weeks.find(w=>m._d>=w.s && m._d<w.e); if(w){ w.g+=m.g; w.t+=m.t; w.n++; } });
  const pts = weeks.map((w,i)=>({i, v: w.t? w.g/w.t*100 : null, w})).filter(p=>p.v!=null);
  if(!pts.length) return '<p class="empty">Nessuna missione nelle ultime 8 settimane.</p>';
  const W=340,H=180,L=36,R=10,T=10,B=26;
  const X=i=>L+i/7*(W-L-R), Y=v=>T+(1-v/100)*(H-T-B);
  let g='<g class="grid">'; [0,50,100].forEach(v=>{ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="lbl" x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'%</text>'; }); g+='</g>';
  const xl=[0,4,7].map((i,k)=>'<text class="lbl" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="'+(k===0?"start":k===2?"end":"middle")+'">'+(i===7?"questa sett.":esc(weeks[i].s.getDate()+" "+MESI[weeks[i].s.getMonth()].slice(0,3)))+'</text>').join("");
  const line = pts.length>1 ? '<polyline class="series" points="'+pts.map(p=>X(p.i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ")+'"/>' : "";
  const dots = pts.map(p=>'<circle r="4.5" cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'"><title>Settimana dal '+esc(shortDate(p.w.s))+': '+Math.round(p.v)+'% su '+plural(p.w.n,"missione","missioni")+'</title></circle>').join("");
  const desc = pts.map(p=>"settimana dal "+shortDate(p.w.s)+" "+Math.round(p.v)+"%").join("; ");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Risposte giuste per settimana: '+esc(desc)+'">'+g+xl+line+dots+'</svg>';
}

function gamesSVG(gio, days){
  const n = Math.min(days||30, 30), map={};
  gio.forEach(x=>{ const k=dayKey(x._d); map[k]=(map[k]||0)+x.min; });
  const arr=[]; for(let i=n-1;i>=0;i--){ const d=dayStart(i); arr.push({d, m:map[dayKey(d)]||0}); }
  const W=340,H=180,L=36,R=8,T=10,B=26, top=Math.max(150, ...arr.map(a=>a.m))*1.05;
  const bw=(W-L-R)/n, Y=v=>T+(1-v/top)*(H-T-B);
  let g='<g class="grid">'; [0,60,120].forEach(v=>{ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="lbl" x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+(v/60)+' h</text>'; }); g+='</g>';
  const bars = arr.map((a,i)=> a.m ? '<rect class="b'+(a.m>LIMITE_GIOCO?' over':'')+'" x="'+(L+i*bw+bw*0.15).toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" y="'+Y(a.m).toFixed(1)+'" height="'+(Y(0)-Y(a.m)).toFixed(1)+'" rx="2"><title>'+esc(longDate(a.d))+': '+Math.round(a.m)+' min</title></rect>' : '').join("");
  const lim='<line class="limit" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(LIMITE_GIOCO).toFixed(1)+'" y2="'+Y(LIMITE_GIOCO).toFixed(1)+'"/>';
  const xl=[0,Math.floor((n-1)/2),n-1].map((i,k)=>'<text class="lbl" x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(k===0?"start":k===2?"end":"middle")+'">'+(i===n-1?"oggi":esc(arr[i].d.getDate()+" "+MESI[arr[i].d.getMonth()].slice(0,3)))+'</text>').join("");
  const desc = arr.filter(a=>a.m).map(a=>shortDate(a.d)+" "+Math.round(a.m)+" min").join("; ")||"nessun gioco";
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Minuti di gioco al giorno: '+esc(desc)+'">'+g+bars+lim+xl+'</svg>';

        '<li><div><div class="when">'+esc(n)+'</div><div class="meta">'+(a.tipo?esc(a.tipo.toLowerCase())+', ':'')+plural(a.p,"partita","partite")+', '+a.v+' completate o vinte'+(a.e?', '+plural(a.e,"errore","errori"):'')+'</div></div><div class="vals">'+Math.round(a.min)+' min</div></li>').join("")+'</ul>';
  }

}

/* ---------- prossimi appuntamenti (blocco 5b) ----------
   Le pagine non leggono il calendario: la fonte è la scheda Appuntamenti del foglio.
   Misure: Sibilla il 27 di ogni mese, Edoardo il 27 ogni 3 mesi (febbraio, maggio, agosto, novembre). */
const AP_TIPI = [["visita","Visita"],["vaccino","Vaccino"],["bilancio","Bilancio"],["altro","Altro"]];
const AP_CHIUSI = ["fatto","annullato"];
let pOpen = false, pTipo = "visita", pErr = "";
function appToSheet(o){ const sd=toSerial(o.data); return [o.id, sd==null?o.data:sd, o.bambino, o.tipo, o.titolo, "", o.luogo||"", o.note||"", "da mettere in calendario", "app-genitori"]; }
function d0(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysTo(d){ return Math.round((d0(d) - dayStart(0)) / 864e5); }
function traTxt(n){ return n===0 ? "oggi" : n===1 ? "domani" : n===-1 ? "ieri" : n>1 ? "tra "+n+" giorni" : plural(-n,"giorno fa","giorni fa"); }
function tipoLabel(t){ const x=AP_TIPI.concat([["misura","Misura"]]).find(y=>y[0]===String(t).toLowerCase()); return x? x[1] : (t||"Appuntamento"); }
function appFor(c){
  const ids = new Set(S.app.map(a=>a.id));
  return S.app.concat(S.qs.appunt.filter(q=>!ids.has(q.id)).map(q=>Object.assign({pending:true, stato:"da mettere in calendario"}, q)))
    .filter(a=>a.bambino===c || /^tutt/i.test(a.bambino))
    .map(a=>Object.assign({}, a, {_d:parseDate(a.data), _e:parseDate(a.entro)}))
    .filter(a=>a._d && !AP_CHIUSI.includes(String(a.stato).toLowerCase()));
}
/* prossimi: dal giorno di oggi in poi; un bilancio resta finché la sua finestra ("Entro") è aperta */
function appProssimi(c){
  return appFor(c).filter(a=>daysTo(a._d)>=0 || (a._e && daysTo(a._e)>=0)).sort((a,b)=>a._d-b._d);
}
function nextMisura(c){
  const ms = measuresFor(c), last = ms.length ? ms[ms.length-1] : null, oggi = dayStart(0);
  const ok = m=> c==="Sibilla" ? true : [1,4,7,10].includes(m);
  for(let i=0;i<14;i++){
    const d = new Date(oggi.getFullYear(), oggi.getMonth()+i, 27);
    if(d<oggi || !ok(d.getMonth())) continue;
    if(i===0 && daysTo(d)===0 && last && last._d && dayKey(last._d)===dayKey(oggi)) continue;
    return {d, last};
  }
  return null;
}
function viewAppOggi(c){
  const list = appProssimi(c), nm = nextMisura(c);
  const now=new Date(); const local = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+"T09:00";

  if(nm){

      '<div class="note-txt">Peso e altezza'+(c==="Edoardo"?' (ogni 3 mesi)':' (ogni mese)')+
      (nm.last && nm.last._d ? '<span style="color:var(--muted)"> · ultima misura il '+esc(shortDate(nm.last._d))+'</span>' : '')+'</div>'+
      (n===0?'<button class="btn small" style="margin-top:6px" data-go="crescita">Inserisci la misura</button>':'')+'</li>';

  list.slice(0,3).forEach(a=>{
    const n = daysTo(a._d), aperta = n<0 && a._e;

    const quando = aperta ? 'finestra aperta, entro il '+shortDate(a._e)+' · '+traTxt(daysTo(a._e)).replace(/^tra /,"mancano ")
      : longDate(a._d)+ora+' · '+traTxt(n)+(a._e ? ' · entro il '+shortDate(a._e) : '');
    const st = String(a.stato||"").toLowerCase();
    h += '<li><div class="when"><span class="ctag">'+esc(tipoLabel(a.tipo))+'</span>'+esc(quando)+
      (st && st!=="prenotato" ? '<span class="tag">'+esc(st)+'</span>' : '')+(a.pending?'<span class="tag">in attesa</span>':'')+'</div>'+
      '<div class="note-txt">'+esc(a.titolo||tipoLabel(a.tipo))+(a.luogo?'<span style="color:var(--muted)"> · '+esc(a.luogo)+'</span>':'')+'</div>'+
      (a.pending?'<button class="btn ghost small" style="margin-top:6px" data-delp="'+esc(a.id)+'">Elimina</button>':'')+'</li>';
  });
  if(!nm && !list.length) h += '<li><div class="note-txt">Nessun appuntamento in programma.</div></li>';
  h += '</ul>';
  if(list.length>3) h += '<p class="lead" style="font-size:14px;margin:8px 0 0">E altri '+(list.length-3)+' più avanti, nella scheda Appuntamenti del foglio.</p>';
  if(pOpen){
    h += '<div class="tform" style="margin:14px 0 0">'+(pErr?'<p class="formerr" role="alert">'+esc(pErr)+'</p>':'')+
      '<div class="seg" role="group" aria-label="Tipo">'+AP_TIPI.map(([k,l])=>'<button data-ptipo="'+k+'" aria-pressed="'+(pTipo===k)+'">'+l+'</button>').join("")+'</div>'+
      '<div class="field"><label for="p-tit">Che cosa</label><input id="p-tit" maxlength="80" placeholder="'+(pTipo==="vaccino"?"Quale vaccino?":pTipo==="bilancio"?"Bilancio di salute":"Per esempio: visita dal pediatra")+'"></div>'+
      '<div class="grid3"><div class="field"><label for="p-data">Data e ora</label><input id="p-data" type="datetime-local" value="'+local+'"></div>'+
      '<div class="field"><label for="p-luogo">Dove</label><input id="p-luogo" maxlength="60" placeholder="Facoltativo"></div></div>'+
      '<div class="field"><label for="p-note">Note</label><input id="p-note" maxlength="200" placeholder="Facoltative"></div>'+
      '<div class="row" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="p-save">Salva</button><button class="btn ghost" id="p-cancel">Annulla</button></div>'+
      '<p class="lead" style="font-size:14px;margin:10px 0 0">Va sul foglio come «da mettere in calendario»: per l’evento sul telefono, chiedilo a Claude in chat.</p></div>';
  }else{
    h += '<p style="margin:14px 0 0"><button class="btn ghost" id="p-open">Aggiungi appuntamento</button></p>';
  }
  h += '<p class="lead" style="font-size:14px;margin:10px 0 0">Per segnare «fatto» o cambiare un appuntamento, modifica la colonna Stato nella scheda Appuntamenti del foglio.</p></div>';
  return h;
}
function addAppunt(){
  const v = id=>$(id) ? $(id).value.trim() : "";
  const titolo = v("p-tit") || tipoLabel(pTipo), when = v("p-data"), d = when ? new Date(when) : null;
  if(!d || isNaN(d)){ pErr="Scegli data e ora."; render(); return false; }
  if(daysTo(d) < -1){ pErr="La data è già passata: le visite fatte si segnano in Salute."; render(); return false; }
  S.qs.appunt.push({id:"genitori-appuntamento-"+Date.now(), data:stamp(d), bambino:S.child, tipo:pTipo, titolo, luogo:v("p-luogo"), note:v("p-note"), stato:"da mettere in calendario"});
  save(); pOpen=false; pErr=""; toast("Appuntamento salvato"); render(); sync(false); return true;
}

const PCURVE = [[3,-1.88079],[15,-1.03643],[50,0],[85,1.03643],[97,1.88079]];
function sexOf(c){ const v=String((S.sex||{})[c]||""); if(/^f/i.test(v)) return "F"; if(/^m/i.test(v)) return "M"; return c==="Sibilla"?"F":"M"; }
function ageMonths(b,d){ const b0=new Date(b.getFullYear(),b.getMonth(),b.getDate()); return (d-b0)/(864e5*30.4375); }  /* dalla mezzanotte del giorno di nascita */
/* tabella per misura ed età: sotto i 24 mesi lunghezza (sdraiata), poi altezza (in piedi) */
function omsTab(sex,key,t){ const s=OMS[sex]; if(key==="altezza") return t<24 ? s.lun : s.alt; return key==="peso" ? s.peso : s.cc; }
function omsMax(sex,key){ const tb=omsTab(sex,key,999); return tb.a + tb.d.length/3 - 1; }
function lmsAt(sex,key,t){
  if(t==null || t<0) return null;
  const tb=omsTab(sex,key,t), n=tb.d.length/3, i=t-tb.a;
  if(i<0 || i>n-1) return null;
  const k=Math.min(Math.floor(i), n-2), f=i-k, g=j=>tb.d[k*3+j]+(tb.d[(k+1)*3+j]-tb.d[k*3+j])*f;
  return n<2 ? {L:tb.d[0],M:tb.d[1],S:tb.d[2]} : {L:g(0),M:g(1),S:g(2)};
}
function lmsVal(p,z){ return p.L===0 ? p.M*Math.exp(p.S*z) : p.M*Math.pow(1+p.L*p.S*z, 1/p.L); }
function lmsZ(p,x,restrict){
  let z = p.L===0 ? Math.log(x/p.M)/p.S : (Math.pow(x/p.M,p.L)-1)/(p.L*p.S);
  if(restrict && z>3){ const s3=lmsVal(p,3); z=3+(x-s3)/(s3-lmsVal(p,2)); }        /* metodo OMS oltre ±3 per il peso */
  else if(restrict && z<-3){ const s3=lmsVal(p,-3); z=-3+(x-s3)/(lmsVal(p,-2)-s3); }
  return z;
}
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
/* percentile di una misura: {p, z} oppure null se l'età è fuori dalle tabelle */
function percOf(c,key,x,d){
  const b=birthOf(c); if(!b || x==null || !d) return null;
  const t=ageMonths(b,d), p=lmsAt(sexOf(c),key,t); if(!p) return null;
  const z=lmsZ(p,x,key==="peso"); return {z, p:normCdf(z)*100};
}
function pLabel(r){ if(!r) return ""; const p=r.p; if(p<1) return "sotto il 1°"; if(p>99) return "sopra il 99°"; return Math.round(p)+"°"; }
function band(r){ const p=r.p; return p<3?0: p<15?1: p<50?2: p<85?3: p<97?4: 5; }
function niceStep(range,n){ const raw=range/n, pw=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/pw; return (f<1.5?1:f<3?2:f<7?5:10)*pw; }
function ageTick(t){ t=Math.round(t); if(t<24) return t+" m"; const y=Math.floor(t/12), m=t%12; return y+" a"+(m?" "+m+" m":""); }

function growthSVG(c, ms, key, unit, dec){
  const b=birthOf(c), sex=sexOf(c), now=new Date();
  const pts = ms.filter(m=>m[key]!=null).map(m=>Object.assign({t:ageMonths(b,m._d)}, m)).filter(p=>p.t>=0);
  const tNow=ageMonths(b,now), tMax=omsMax(sex,key);
  const tsData=pts.map(p=>p.t);
  let lo=Math.max(0, Math.min(tNow, ...tsData) - 1), hi=Math.max(tNow, ...tsData) + 2;
  const minSpan = hi<36 ? 12 : 24;
  if(hi-lo<minSpan){ const need=minSpan-(hi-lo); const down=Math.min(lo, need*0.6); lo-=down; hi+=need-down; }
  if(lo>=tMax) return null;                     /* fuori dalle tabelle OMS */
  const cHi=Math.min(hi,tMax);
  const W=340,H=236,L=40,R=30,T=12,B=30;
  /* curve campionate, spezzate a 24 mesi per l'altezza */
  const segs=[]; const cut = key==="altezza" && lo<24 && cHi>24 ? 24 : null;
  const ranges = cut ? [[lo,24-1e-6],[24,cHi]] : [[lo,cHi]];
  ranges.forEach(([a,z])=>{ const n=Math.max(2,Math.ceil((z-a)/(hi-lo)*70)); const s=[];
    for(let i=0;i<=n;i++){ const t=a+(z-a)*i/n, p=lmsAt(sex,key,t); if(p) s.push({t, v:PCURVE.map(q=>lmsVal(p,q[1]))}); }
    if(s.length>1) segs.push(s); });
  let y0=Infinity,y1=-Infinity;
  segs.forEach(s=>s.forEach(q=>{ y0=Math.min(y0,q.v[0]); y1=Math.max(y1,q.v[4]); }));
  pts.forEach(p=>{ if(p.t>=lo-0.01 && p.t<=hi+0.01){ y0=Math.min(y0,p[key]); y1=Math.max(y1,p[key]); } });
  const pad=(y1-y0)*0.05; y0-=pad; y1+=pad;
  const X=t=>L+(t-lo)/(hi-lo)*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B), f=n=>n.toFixed(1);
  let g='<g class="grid">'; const st=niceStep(y1-y0,4);
  for(let v=Math.ceil(y0/st)*st; v<=y1; v+=st){ const y=Y(v); g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+f(y)+'" y2="'+f(y)+'"/><text class="lbl" x="'+(L-6)+'" y="'+f(y+4)+'" text-anchor="end">'+fmt(v,st<1?1:0)+'</text>'; }
  g+='</g>';
  const span=hi-lo, maxLab = lo>=24 ? 4 : 6, xs = [1,2,3,6,12,24].find(s=>span/s<=maxLab) || 24;
  let xl=''; for(let t=Math.ceil(lo/xs)*xs; t<=hi; t+=xs){ const x=X(t); if(x<L+8||x>W-R-4) continue; xl+='<text class="lbl" x="'+f(x)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(ageTick(t))+'</text>'; }
  const poly=(s,i,j)=>s.map(q=>f(X(q.t))+","+f(Y(q.v[i]))).join(" ")+" "+s.slice().reverse().map(q=>f(X(q.t))+","+f(Y(q.v[j]))).join(" ");
  let cv='';
  segs.forEach(s=>{
    cv+='<polygon class="pb out" points="'+poly(s,0,1)+'"/><polygon class="pb mid" points="'+poly(s,1,3)+'"/><polygon class="pb out" points="'+poly(s,3,4)+'"/>';
    PCURVE.forEach((q,i)=>{ cv+='<polyline class="pc'+(q[0]===50?' p50':'')+'" points="'+s.map(r=>f(X(r.t))+","+f(Y(r.v[i]))).join(" ")+'"/>'; });
  });
  if(cut && 24>lo && 24<hi) cv+='<line class="cut" x1="'+f(X(24))+'" x2="'+f(X(24))+'" y1="'+T+'" y2="'+(H-B)+'"/>';
  const last=segs.length? segs[segs.length-1][segs[segs.length-1].length-1] : null;
  if(last && cHi>=hi-0.01){ let prev=-99;
    PCURVE.forEach((q,i)=>{ const y=Y(last.v[i]); if(Math.abs(y-prev)<9) return; cv+='<text class="lbl pl" x="'+(W-R+4)+'" y="'+f(y+4)+'">'+q[0]+'</text>'; prev=y; }); }
  const vis=pts.filter(p=>p.t>=lo-0.01 && p.t<=hi+0.01);
  const line = vis.length>1 ? '<polyline class="mseries" points="'+vis.map(p=>f(X(p.t))+","+f(Y(p[key]))).join(" ")+'"/>' : "";
  const dots = vis.map(p=>{ const r=percOf(c,key,p[key],p._d);
    return '<circle r="4.5" class="m'+(p.pending?" pend":"")+'" cx="'+f(X(p.t))+'" cy="'+f(Y(p[key]))+'"><title>'+esc(ageLabel(b,p._d)+": "+fmt(p[key],dec)+" "+unit+(r?", "+pLabel(r)+" percentile":""))+'</title></circle>'; }).join("");
  const desc = vis.length ? vis.map(p=>{ const r=percOf(c,key,p[key],p._d); return ageLabel(b,p._d)+" "+fmt(p[key],dec)+" "+unit+(r?" ("+pLabel(r)+" percentile)":""); }).join("; ") : "nessuna misura";
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Curve percentili OMS 3, 15, 50, 85 e 97. Misure: '+esc(desc)+'">'+cv+g+xl+line+dots+'</svg>';
}

/* testo sotto il grafico: ultima misura, avvisi tranquilli */
function percNote(c, ms, key, unit, dec){
  const b=birthOf(c), pts=ms.filter(m=>m[key]!=null);
  const withP = pts.map(m=>({m, r:percOf(c,key,m[key],m._d)})).filter(x=>x.r);
  let h='';
  if(withP.length){
    const lastP=withP[withP.length-1], lt=ageMonths(b,lastP.m._d);
    h+='<p class="pnote"><b>'+esc(pLabel(lastP.r))+' percentile</b> all\'ultima misura ('+esc(fmt(lastP.m[key],dec)+" "+unit+", "+ageLabel(b,lastP.m._d))+').</p>';
    const warn=[];
    if(lastP.r.p<3 || lastP.r.p>97) warn.push('L\'ultima misura è fuori dalla fascia tra 3° e 97° percentile. Una misura da sola dice poco, conta come va nel tempo: mostrala al pediatra al prossimo controllo, o prima se ti preoccupa.');
    const prev = withP.filter(x=>{ const t=ageMonths(b,x.m._d); return t>=1 && lt-t>=2 && lt-t<=12; });
    if(lt>=1 && prev.some(x=>Math.abs(band(x.r)-band(lastP.r))>=2)) warn.push('Negli ultimi mesi la misura ha attraversato due linee percentili. Può succedere, ma è un andamento da far vedere al pediatra.');
    warn.forEach(w=>{ h+='<p class="pwarn">'+w+'</p>'; });
  }
  return h;
}

function chartSVG(ms, key, unit, dec, birth){
  const pts = ms.filter(m=>m[key]!=null);
  if(!pts.length) return '<p class="empty">Nessun dato per questo grafico.</p>';
  const W=340,H=210,L=42,R=12,T=12,B=30;
  let x0=pts[0]._d.getTime(), x1=pts[pts.length-1]._d.getTime();
  if(x1-x0 < 86400000*20){ x0-=86400000*15; x1+=86400000*15; }
  let ys=pts.map(p=>p[key]), y0=Math.min(...ys), y1=Math.max(...ys);
  const span=Math.max(y1-y0, key==="peso"?1:4); const mid=(y0+y1)/2;
  y0=mid-span*0.65; y1=mid+span*0.65;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g='<g class="grid">';
  for(let i=0;i<=3;i++){ const v=y0+(y1-y0)*i/3, y=Y(v); g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="lbl" x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmt(v,key==="peso"?1:0)+'</text>'; }
  g+='</g>';
  const xs=[x0,(x0+x1)/2,x1];
  const xl=xs.map((t,i)=>{ const d=new Date(t); const lab = birth? shortAge(birth,d) : shortDate(d);
    return '<text class="lbl" x="'+X(t).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?"start":i===2?"end":"middle")+'">'+esc(lab)+'</text>'; }).join("");
  const line = pts.length>1 ? '<polyline class="series" points="'+pts.map(p=>X(p._d.getTime()).toFixed(1)+","+Y(p[key]).toFixed(1)).join(" ")+'"/>' : "";
  const dots = pts.map(p=>'<circle r="4.5" class="'+(p.pending?"pend":"")+'" cx="'+X(p._d.getTime()).toFixed(1)+'" cy="'+Y(p[key]).toFixed(1)+'"><title>'+esc(shortDate(p._d))+': '+fmt(p[key],dec)+' '+unit+'</title></circle>').join("");
  const desc = pts.map(p=>shortDate(p._d)+" "+fmt(p[key],dec)+" "+unit).join("; ");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento: '+esc(desc)+'">'+g+xl+line+dots+'</svg>';
}

function growthBlock(c,ms,cur){
  const b=birthOf(c), key=cur[0];
  if(!b) return chartSVG(ms,key,cur[2],cur[3],null)+'<p class="small-note">Per le curve OMS serve la data di nascita: si legge dal foglio, scheda Bambini.</p>';
  const svg=growthSVG(c,ms,key,cur[2],cur[3]);
  if(!svg){
    const why = key==="peso" ? "Dopo i 10 anni l'OMS non usa più il peso per età: durante la crescita della pubertà conta l'altezza." :
      key==="cc" ? "Le curve OMS della circonferenza cranica arrivano a 5 anni." : "Le curve OMS caricate nell'app arrivano a 12 anni.";
    return chartSVG(ms,key,cur[2],cur[3],b)+'<p class="small-note">'+why+'</p>';
  }
  let h=svg+percNote(c,ms,key,cur[2],cur[3]);
  h+='<p class="small-note">Le fasce vanno dal 3° al 97° percentile, la linea più marcata è il 50°. In basso l\'età. Curve OMS per '+(sexOf(c)==="F"?"bambine":"bambini")+'.'+
    (key==="altezza" && ageMonths(b,new Date())<30 ? ' Fino a 2 anni si misura la lunghezza da sdraiata, poi l\'altezza in piedi, che è circa 0,7 cm in meno: per questo le curve fanno un piccolo salto a 2 anni.' : '')+'</p>';
  return h;
}

function nannaSVG(map){
  const W=340,H=180,L=30,R=8,T=12,B=26, N=14;
  const days=[]; for(let o=N-1;o>=0;o--){ const k=dayKey(dayStart(o)); days.push({k, d:dayStart(o), r:map[k]}); }
  const vals = days.filter(x=>x.r).map(x=>x.r.ore);
  if(!vals.length) return '<p class="empty">Ancora nessun giorno segnato nelle ultime due settimane.</p>';
  const top = Math.max(16, Math.ceil(Math.max(...vals)/2)*2+2);
  const bw=(W-L-R)/N, Y=v=>T+(1-v/top)*(H-T-B);
  let g='<g class="grid">';
  for(let v=0; v<=top; v+=4){ const y=Y(v); g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="lbl" x="'+(L-5)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+v+'</text>'; }
  g+='</g>';
  let bars='';
  days.forEach((x,i)=>{
    const cx=L+bw*i+bw/2;
    if(x.r){ const y=Y(x.r.ore); bars+='<rect class="nb'+(x.r.pending?' pend':'')+'" x="'+(cx-bw*0.34).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.68).toFixed(1)+'" height="'+(Y(0)-y).toFixed(1)+'" rx="3"><title>'+esc(dayWord(x.k))+': '+fmt(x.r.ore,1)+' ore</title></rect>'; }
    else bars+='<circle class="miss" cx="'+cx.toFixed(1)+'" cy="'+(Y(0)-3).toFixed(1)+'" r="2.5"/>';
    if(i%2===1 || i===N-1) bars+='<text class="lbl" x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+x.d.getDate()+'</text>';
  });
  const a7=avgDays(map,0,6);
  const avg = a7 ? '<line class="avg" x1="'+(L+bw*7).toFixed(1)+'" x2="'+(W-R)+'" y1="'+Y(a7.avg).toFixed(1)+'" y2="'+Y(a7.avg).toFixed(1)+'"/>' : '';
  const desc = days.filter(x=>x.r).map(x=>dayWord(x.k)+" "+fmt(x.r.ore,1)+" ore").join("; ");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ore di sonno degli ultimi 14 giorni: '+esc(desc)+'">'+g+bars+avg+'</svg>';
}

  }
  h += '<div class="panel">';
  if(!list.length) h += '<p class="lead">'+(all.length?'Nessuna nota in questa categoria.':'Il diario è ancora vuoto. La prima nota può essere anche solo una parola.')+'</p>';
  else{
    let lastM = "", html = "";
    list.forEach(n=>{
      const m = MESI[n._d.getMonth()]+" "+n._d.getFullYear();
      if(m!==lastM){ if(lastM) html += '</ul>'; html += '<div class="month">'+esc(m.charAt(0).toUpperCase()+m.slice(1))+'</div><ul class="dlist">'; lastM = m; }
      const foto = safeUrl(n.foto);
      html += '<li><div class="when"><span class="ctag">'+esc(catLabel(n.cat))+'</span>'+esc(GIORNI[n._d.getDay()]+" "+n._d.getDate()+", "+pad(n._d.getHours())+":"+pad(n._d.getMinutes()))+
        (n.pending?'<span class="tag">in attesa</span>':'')+'</div>'+
        '<div class="note-txt">'+esc(n.testo)+'</div>'+
        (foto?'<div style="margin-top:4px"><a href="'+esc(foto)+'" target="_blank" rel="noopener">Apri la foto</a></div>':'')+
        (n.pending?'<button class="btn ghost small" style="margin-top:6px" data-deld="'+esc(n.id)+'">Elimina</button>':'')+
      '</li>';
    });
    h += html + '</ul><p class="lead" style="font-size:14px;margin:12px 0 0">Per correggere una nota già inviata, modificala nel foglio, scheda Diario.</p>';
  }
  h += '</div>';
  return h;
}

/* ---------- salute (blocco 5d) ----------
   Scheda Salute del foglio: ID | Data | Bambino | Tipo | Che cosa | Dettagli | Febbre (°C) | Episodio (ID) | Note | Origine.
   Tipo: vaccino, malattia (episodio), febbre, farmaco, visita, guarito (chiude l'episodio), nota.

   Calendario vaccinale: Regione Marche, PRPV 2023-2025 (DGR 797 del 27/05/2024, recepisce il PNPV 2023-2025),
   tabella e note su vaccinarsinellemarche.org, controllate il 25/10/2026. Mesi e anni compiuti (2 mesi = dal 61° giorno).
   m = età in mesi da cui si fa; w = mesi dopo i quali, se non segnato, diventa "da controllare sul libretto".
   Vaccino = nome + dose (testo esatto): non cambiare i testi, le righe vecchie non verrebbero più riconosciute. */
const VACC = [
